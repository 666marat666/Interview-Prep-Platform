<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interview Prep Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <style>
      /* Simple reset just to ensure full height */
      html, body {
        height: 100%;
        margin: 0;
        background-color: #f3f4f6; /* Tailwind gray-100 */
      }
      /* Custom scrollbar for code editor */
      textarea.code-editor::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      textarea.code-editor::-webkit-scrollbar-track {
        background: #1e1e1e;
      }
      textarea.code-editor::-webkit-scrollbar-thumb {
        background: #4a4a4a;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
